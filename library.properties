sentence=ESP32 and ESP8266 KNXnet/IP application client.
paragraph=Checked datapoint codecs, multicast routing, discovery and UDP tunnelling without a web server. Uses Network API on Arduino-ESP32 3.x and WiFiUDP on ESP8266. Supports 128 group-address assignments by default, configurable up to 255. Includes an ESP32 example with Wi-Fi provisioning, Ethernet fallback and automatic routing recovery.
